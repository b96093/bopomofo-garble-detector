<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>注音亂碼偵測 — 版本比較</title>
<!--
  版本比較說明影片：1080×1080、30fps、90 秒。設計：docs/superpowers/specs/2026-10-12-版本比較影片-design.md
  render(t) 依時間 t（秒）畫出每一格，同一個 t 永遠畫出同一格；state() 從 DOM 讀出畫面狀態給 check-compare.mjs。
  Chrome 版的候選窗與小按鈕直接 import 擴充本身的 src/content/popup.js、hint.js，候選來自擴充引擎 detect
  的實際輸出（需用 --allow-file-access-from-files 開啟，見 cdp.mjs）。桌面版候選窗照產品 BuildLayout 匯出的
  popup.js、compare-popup-docs.js 畫。網址加 ?play 可在瀏覽器裡直接播放預覽。

  時間軸（秒）
    0–6     標題；兩盞燈依序閃一下；字卡說明燈的意思
    6–18    09:00 回信（瀏覽器）→ Chrome 版
    18–30   10:30 聊天 → 桌面版
    30–44   14:00 整段會議紀錄 → 桌面版（Chrome 版：沒有這個功能）
    44–58   16:00 Google 文件 → Chrome 版讀不到，桌面版接手
    58–70   21:00 留言：選取 → 小按鈕 → 候選窗 → Chrome 版
    70–88   總結卡，兩盞燈都亮
    88–90   淡出
-->
<style>
:root {
  --ink: #1E1E1E; --muted: #707070; --line: #1E1E1E; --bar: #FFE9A8; --teal: #6FA8B5; --pink: #EFAFB0;
  --wave: #E5484D; --pick: #BCD6F5; --lamp: #FFC83D; --off: #D5D5D5;
}
html, body { margin: 0; background: var(--teal); }
#stage { position: relative; width: 1080px; height: 1080px; overflow: hidden;
  font-family: "Microsoft JhengHei", sans-serif; color: var(--ink);
  background: linear-gradient(160deg, #6FA8B5 0%, #86B9C4 55%, #A6CBD2 100%); }
.abs { position: absolute; }
.blob { border-radius: 50%; }
#blob1 { left: -220px; top: 760px; width: 600px; height: 600px; background: var(--pink); opacity: .55; }
#blob2 { left: 720px; top: -160px; width: 460px; height: 460px; background: #fff; opacity: .2; }
.card { background: #fff; border: 5px solid var(--line); border-radius: 26px; box-shadow: 12px 12px 0 var(--line); }
.sticker { left: 0; right: 0; width: fit-content; max-width: 980px; margin: 0 auto; background: #fff; text-align: center;
  border: 5px solid var(--line); border-radius: 22px; box-shadow: 8px 8px 0 var(--line); padding: 10px 30px; font-weight: 700; }

/* 兩盞燈：亮的那盞＝現在是這一版在幫你 */
.lamp { top: 26px; width: 330px; height: 80px; box-sizing: border-box; display: flex; align-items: center; gap: 18px;
  padding: 0 26px; font-size: 34px; font-weight: 700; background: #fff; border: 5px solid var(--line);
  border-radius: 40px; box-shadow: 6px 6px 0 var(--line); }
#lampC { left: 150px; }
#lampD { left: 600px; }
.bulb { width: 38px; height: 38px; border-radius: 50%; border: 4px solid var(--line); background: var(--off); flex: none; }
.bulb.on { background: var(--lamp); box-shadow: 0 0 0 8px rgba(255, 200, 61, .35), 0 0 30px rgba(255, 200, 61, .9); }
#tagC { left: 330px; top: 84px; font-size: 26px; font-weight: 700; color: #fff; background: var(--wave); white-space: nowrap;
  border: 4px solid var(--line); border-radius: 14px; padding: 2px 14px; transform: rotate(4deg); }

#caption { top: 150px; font-size: 40px; line-height: 1.35; }
#title { top: 470px; font-size: 60px; }
#clock { left: 24px; top: 236px; font-size: 34px; font-weight: 700; background: var(--ink); color: #fff;
  border-radius: 14px; padding: 4px 18px; font-variant-numeric: tabular-nums; transform: rotate(-4deg); z-index: 5; }

/* 每一站的視窗 */
.win { left: 50px; top: 270px; width: 980px; height: 770px; overflow: hidden; }
.wbar { position: absolute; left: 0; top: 0; width: 100%; height: 68px; box-sizing: border-box; background: var(--bar);
  border-bottom: 5px solid var(--line); border-radius: 21px 21px 0 0; display: flex; align-items: center; gap: 18px;
  padding: 0 24px; font-size: 28px; font-weight: 700; }
.dots { width: 74px; height: 18px; flex: none;
  background: radial-gradient(circle 8px at 9px 9px, #fff 7px, var(--line) 8px, transparent 9px) 0 0 / 28px 18px repeat-x; }
.addr { flex: 1; background: #fff; border: 4px solid var(--line); border-radius: 20px; padding: 2px 20px;
  font-size: 24px; font-weight: 400; color: var(--muted); }
.caret { display: inline-block; width: 3px; height: 44px; background: var(--ink); vertical-align: -9px; }

/* 第 1 站：回信 */
.mailSubj { left: 40px; top: 96px; font-size: 30px; color: var(--muted); }
.mailBody { left: 40px; font-size: 40px; white-space: pre; }
/* 第 2 站：聊天（同宣傳片） */
.avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--pink); border: 4px solid var(--line); box-sizing: border-box; }
.bubble { font-size: 36px; line-height: 50px; padding: 18px 28px; border-radius: 28px; white-space: pre; }
#chatInBubble { left: 40px; top: 110px; background: #EEF0F2; }
#chatIn { left: 30px; top: 640px; width: 910px; height: 100px; box-sizing: border-box; border: 4px solid var(--line);
  border-radius: 26px; font-size: 38px; line-height: 92px; padding-left: 30px; white-space: pre; }
/* 第 4 站：Google 文件（通用的線上文件樣式） */
#docsDesk { left: 0; top: 68px; width: 100%; height: 702px; background: #EEF1F4; }
#docsPage { left: 120px; top: 40px; width: 740px; height: 700px; background: #fff; border: 3px solid #D0D4D9; }
#docsTitle { left: 60px; top: 50px; font-size: 40px; font-weight: 700; }
#docsText { left: 60px; top: 140px; font-size: 36px; white-space: pre; }

/* 總結卡 */
#sum { left: 50px; top: 270px; width: 980px; height: 770px; box-sizing: border-box; padding: 40px 36px; }
.row { display: grid; grid-template-columns: 210px 300px 1fr; gap: 0 20px; padding: 18px 0; border-bottom: 3px solid #E6E6E6;
  font-size: 30px; line-height: 1.35; align-items: center; }
.row.head { font-weight: 700; border-bottom: 5px solid var(--line); }
.row div:first-child { font-weight: 700; }
#sumTip { margin-top: 26px; font-size: 27px; line-height: 1.45; background: var(--bar); border: 4px solid var(--line);
  border-radius: 16px; padding: 14px 20px; }

#fade { left: 0; top: 0; width: 1080px; height: 1080px; background: var(--teal); z-index: 50; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="blob1" class="abs blob"></div>
  <div id="blob2" class="abs blob"></div>
  <div id="lampC" class="abs lamp"><i class="bulb"></i>Chrome 版</div>
  <div id="lampD" class="abs lamp"><i class="bulb"></i>桌面版</div>
  <div id="tagC" class="abs"></div>
  <div id="caption" class="abs sticker"></div>
  <div id="title" class="abs sticker"></div>
  <div id="clock" class="abs"></div>

  <div id="w1" class="abs card win">
    <div class="wbar"><i class="dots"></i><span id="mailTab" class="addr"></span></div>
    <div id="mailSubj" class="abs mailSubj"></div>
    <div id="mailGreet" class="abs mailBody" style="top:170px"></div>
    <div id="mailText" class="abs mailBody" style="top:240px"></div>
  </div>
  <div id="w2" class="abs card win">
    <div class="wbar"><i class="avatar"></i><span id="chatName"></span></div>
    <div id="chatInBubble" class="abs bubble"></div>
    <div id="chatIn" class="abs"></div>
  </div>
  <div id="w3" class="abs card win"></div>
  <div id="w4" class="abs card win">
    <div class="wbar"><i class="dots"></i><span id="docsTab" class="addr"></span></div>
    <div id="docsDesk" class="abs"><div id="docsPage" class="abs">
      <div id="docsTitle" class="abs"></div>
      <div id="docsText" class="abs"></div>
    </div></div>
  </div>
  <div id="w5" class="abs card win"></div>

  <div id="dpopChat" class="abs"></div>
  <div id="dpopDocs" class="abs"></div>
  <div id="sum" class="abs card"></div>
  <div id="fade" class="abs"></div>
</div>
<script src="content.js"></script>
<script src="compare-content.js"></script>
<script src="popup.js"></script>
<script src="compare-popup-docs.js"></script>
<script type="module">
// 擴充本身的元件與引擎：Chrome 版的介面與候選跟真的一樣
import { createPopup } from '../src/content/popup.js';
import { createHint } from '../src/content/hint.js';
import { loadDict } from '../src/engine/dict.js';
import { detect, detectTail } from '../src/engine/detect.js';
const K = window.COMPARE;
const $ = (id) => document.getElementById(id);

// ---------- 時間工具（同 scene.html） ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (p) => 1 - Math.pow(1 - p, 3);
const easeOutBack = (p) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const lerp = (a, b, p) => a + (b - a) * p;
const fade = (t, a, b, f = 0.2) => Math.min(seg(t, a, a + f), 1 - seg(t, b - f, b));
const inR = (t, a, b) => t >= a && t < b;

const TIMES = { s: [6, 18, 30, 44, 58], sum: 70, out: 88, end: 90 };
window.TIMES = TIMES;
const [S1, S2, S3, S4, S5] = TIMES.s;
const STATION_END = [S2, S3, S4, S5, TIMES.sum];

// ---------- 燈 ----------
// 各站「產品出手」的時間點；Task 4、5 會用到同一組常數
const AT = {
  mailPopup: S1 + 3.8, chatPopup: S2 + 3.4, blockIcon: S3 + 3.2,
  blink0: S4 + 3.6, blink1: S4 + 4.8, docsPopup: S4 + 5.4, postHint: S5 + 2.9,
};
function lampOn(which, t) {
  if (which === 'C') {
    if (inR(t, 2.0, 2.6)) return true;
    if (inR(t, AT.blink0, AT.blink1)) return Math.floor((t - AT.blink0) / 0.3) % 2 === 0;   // 試著幫忙，閃兩下
    return inR(t, AT.mailPopup, S2) || inR(t, AT.postHint, TIMES.sum) || t >= TIMES.sum;
  }
  if (inR(t, 2.8, 3.4)) return true;
  return inR(t, AT.chatPopup, S3) || inR(t, AT.blockIcon, S4) || inR(t, AT.docsPopup, S5) || t >= TIMES.sum;
}
function drawLamps(t) {
  $('lampC').firstChild.className = 'bulb' + (lampOn('C', t) ? ' on' : '');
  $('lampD').firstChild.className = 'bulb' + (lampOn('D', t) ? ' on' : '');
  const tag = inR(t, AT.blockIcon, S4) ? K.tags.none : inR(t, AT.blink1, S5) ? K.tags.cant : '';
  $('tagC').textContent = tag;
  $('tagC').style.opacity = tag ? '1' : '0';
}

// ---------- 字卡 ----------
const CAPS = [
  [3.6, S1, K.legend],
  [S1 + 0.4, S2, K.captions[0]],
  [S2 + 0.4, S3, K.captions[1]],
  [S3 + 0.4, S4, K.captions[2]],
  [S4 + 0.4, S5, K.captions[3]],
  [S5 + 0.4, TIMES.sum, K.captions[4]],
  [TIMES.sum + 0.4, TIMES.out, K.captions[5]],
];
window.CAPS = CAPS;
const popIn = (el, t, a, b, tilt) => {
  const p = easeOutBack(seg(t, a, a + 0.3));
  el.style.opacity = String(fade(t, a, b, 0.12));
  el.style.transform = `rotate(${tilt}deg) scale(${inR(t, a, b) ? lerp(0.6, 1, p) : 0.6})`;
};
function drawCaptions(t) {
  const k = CAPS.findIndex(([a, b]) => inR(t, a, b));
  $('caption').textContent = k >= 0 ? CAPS[k][2] : '';
  if (k >= 0) popIn($('caption'), t, CAPS[k][0], CAPS[k][1], k % 2 ? 1.2 : -1.2);
  else { $('caption').style.opacity = '0'; $('caption').style.transform = 'none'; }
  $('title').textContent = K.title;
  popIn($('title'), t, 0.3, 3.4, -1.5);
}

// ---------- 時鐘與視窗進出 ----------
function stationOf(t) { return TIMES.s.findIndex((s, i) => inR(t, s, STATION_END[i])); }
function drawClock(t) {
  const i = stationOf(t);
  $('clock').textContent = i >= 0 ? K.clocks[i] : '';
  $('clock').style.opacity = i >= 0 ? String(seg(t, TIMES.s[i] + 0.2, TIMES.s[i] + 0.5)) : '0';
}
// 第 i 站：s 起滑入、下一站開始時滑出
function drawWindows(t) {
  TIMES.s.forEach((s, i) => {
    const e = STATION_END[i];
    const pin = easeOut(seg(t, s, s + 0.5)), pout = easeOut(seg(t, e, e + 0.5));
    const el = $('w' + (i + 1));
    const on = inR(t, s, e + 0.5);
    el.style.visibility = on ? 'visible' : 'hidden';
    el.style.transform = `translateX(${1100 * (1 - pin) - 1100 * pout}px)`;
  });
}

const OPTS = { threshold: 0.6, minSyllables: 1 };   // 擴充的預設「積極」（src/content/content.js）
const dict = loadDict();
const MAIL_RES = detectTail(K.mail.garble, dict, OPTS).res;
const POST_RES = detect(K.post.garble, dict, OPTS);
const homsOf = (res) => (k) => { const sy = res.syllables[k]; return sy ? (dict.get(sy) || []).map(([w]) => w) : []; };
const CS = 1.6;   // Chrome 版元件的放大倍率（1.7 時回信的候選窗會超出右緣約 6px）
const cpopup = createPopup();
const CP_HOST = document.documentElement.lastElementChild;   // createPopup 把宿主元素接在 <html> 最後
const chint = createHint();
const CH_HOST = document.documentElement.lastElementChild;
for (const h of [CP_HOST, CH_HOST]) h.style.transformOrigin = '0 0';
// 每一格依時間決定 Chrome 版元件要不要出現、出現在哪；show() 每次都依參數重畫，不留跨格狀態
function drawChromeUI(t, which) {
  if (which && which.popup) {
    cpopup.show(which.rect, { candidates: which.res.candidates, homophonesFor: homsOf(which.res), onCommit: () => {} });
    CP_HOST.style.transform = `scale(${CS})`;
  } else cpopup.hide();
  if (which && which.hint) {
    chint.show(which.rect, which.res.candidates[0], () => {});
    CH_HOST.style.transform = `scale(${CS})`;
  } else chint.hide();
}

// ---------- 桌面版候選窗：照 popup.js（產品 BuildLayout 的實際輸出）畫，同 scene.html ----------
const S = 1.8;   // 桌面版介面的放大倍率（產品以 100% 縮放的邏輯像素為準）
const argb = (v) => `rgba(${(v >>> 16) & 255},${(v >>> 8) & 255},${v & 255},${((v >>> 24) & 255) / 255})`;
function buildDesktopPopup(el, P) {
  Object.assign(el.style, { width: P.w * S + 'px', height: P.h * S + 'px' });
  const frame = document.createElement('div');
  Object.assign(frame.style, { position: 'absolute', left: 0, top: 0, width: P.w * S + 'px', height: P.h * S + 'px',
    background: '#fff', border: `${S}px solid #D8D8D8`, borderRadius: 12 * S + 'px', boxSizing: 'border-box',
    boxShadow: '0 24px 60px rgba(0,0,0,.28)' });   // 柔和陰影只在窗外；窗內完全照產品
  el.appendChild(frame);
  const box = (x, y, w, h) => ({ position: 'absolute', left: x * S + 'px', top: y * S + 'px', width: w * S + 'px', height: h * S + 'px' });
  for (const op of P.ops) {
    if (op.t === 'box') {
      const d = document.createElement('div');
      Object.assign(d.style, box(op.x, op.y, op.w, op.h), { background: argb(op.fill), borderRadius: op.r * S + 'px',
        boxSizing: 'border-box', border: op.border ? `${S}px solid ${argb(op.border)}` : 'none' });
      el.appendChild(d);
    } else if (op.t === 'text') {
      const d = document.createElement('div');
      Object.assign(d.style, box(op.x, op.y, op.w, op.h), { display: 'flex', alignItems: 'center',
        justifyContent: ['flex-start', 'center', 'flex-end'][op.a], fontSize: op.pt * 96 / 72 * S + 'px',
        fontWeight: op.b ? 700 : 400, color: argb(op.c), whiteSpace: 'nowrap' });
      d.textContent = op.s;
      el.appendChild(d);
    } else if (op.t === 'logo') {
      const d = document.createElement('img');
      d.src = '../desktop/icon.ico';
      Object.assign(d.style, box(op.x, op.y, op.s, op.s));
      el.appendChild(d);
    } else if (op.t === 'grip') {
      for (let cx = 0; cx < 2; cx++) for (let cy = 0; cy < 3; cy++) {
        const dot = document.createElement('div');
        Object.assign(dot.style, box(op.x + cx * 4, op.y + cy * 4, 3, 3), { borderRadius: '50%', background: argb(op.c) });
        el.appendChild(dot);
      }
    }
  }
}
buildDesktopPopup($('dpopChat'), window.POPUP);
buildDesktopPopup($('dpopDocs'), window.POPUP_DOCS);
function showDesktopPopup(el, t, from, to, left, top) {
  const on = inR(t, from, to);
  const p = easeOut(seg(t, from, from + 0.15));
  el.style.left = left + 'px';
  el.style.top = top + 'px';
  el.style.opacity = on ? String(p) : '0';
  el.style.transform = `translateY(${on ? 10 * (1 - p) : 0}px)`;
}

// ---------- 打字聲（Task 4、5 補上各站的按鍵） ----------
const HITS = [];
window.keyHits = () => HITS.slice();

// ---------- 打字 ----------
const typeAt = (text, a, b) => [...text].map((_, i) => a + (i + 1) / text.length * (b - a));
const typed = (ats, t) => { let n = 0; while (n < ats.length && ats[n] <= t) n++; return n; };
const caret = () => { const i = document.createElement('i'); i.className = 'caret'; return i; };
const ownText = (el) => [...el.childNodes].filter(n => n.nodeType === Node.TEXT_NODE).map(n => n.data).join('');
// 文字 + 游標（游標在打字時恆亮、停下來後閃爍）；回傳游標元素，用來定位候選窗
function setTyping(el, text, t, typing, caretOn) {
  el.textContent = text;
  if (!caretOn) return null;
  const c = caret();
  c.style.opacity = (typing || Math.floor(t * 2.5) % 2 === 0) ? '1' : '0';
  el.appendChild(c);
  return c;
}
const CHAT = window.CONTENT.chat;
const MAIL_AT = typeAt(K.mail.garble, S1 + 1.0, S1 + 3.6);
const CHAT_AT = typeAt(CHAT.garble, S2 + 1.0, S2 + 3.2);
const DOCS_AT = typeAt(K.docs.garble, S4 + 1.0, S4 + 3.4);
const ENTER = { mail: S1 + 6.6, chat: S2 + 6.6, docs: S4 + 9.0 };
HITS.push(...[...MAIL_AT, ...CHAT_AT, ...DOCS_AT].map(t => ({ t, gain: 0.5 })),
  ...Object.values(ENTER).map(t => ({ t, gain: 1 })));

$('mailTab').textContent = K.mail.tab;
$('mailSubj').textContent = K.mail.subject;
$('mailGreet').textContent = K.mail.greet;
$('chatName').textContent = CHAT.name;
$('chatInBubble').textContent = CHAT.incoming;
$('docsTab').textContent = K.docs.tab;
$('docsTitle').textContent = K.docs.title;

function drawMail(t) {
  const done = t >= ENTER.mail + 0.05;
  const c = setTyping($('mailText'), done ? K.mail.zh : K.mail.garble.slice(0, typed(MAIL_AT, t)), t,
    inR(t, S1 + 1.0, S1 + 3.6), inR(t, S1 + 0.6, S2));
  // 擴充的 caretRect：候選窗開在游標下方
  if (c && inR(t, AT.mailPopup, ENTER.mail)) return { popup: true, res: MAIL_RES, rect: c.getBoundingClientRect() };
  return null;
}
// 這一站只演到第一次 Enter 把亂碼換成中文（產品裡第二次 Enter 才是聊天軟體的送出，這裡不演）
function drawChat(t) {
  const text = t >= ENTER.chat + 0.05 ? CHAT.zh : CHAT.garble.slice(0, typed(CHAT_AT, t));
  setTyping($('chatIn'), text, t, inR(t, S2 + 1.0, S2 + 3.2), inR(t, S2 + 0.6, S3));
  // 候選窗開在輸入框上方（同宣傳片）
  const inputTop = 270 + 5 + 640;
  showDesktopPopup($('dpopChat'), t, AT.chatPopup, ENTER.chat, 80, inputTop - 24 - window.POPUP.h * S);
}
function drawDocs(t) {
  const done = t >= ENTER.docs + 0.05;
  const c = setTyping($('docsText'), done ? K.docs.zh : K.docs.garble.slice(0, typed(DOCS_AT, t)), t,
    inR(t, S4 + 1.0, S4 + 3.4), inR(t, S4 + 0.6, S5));
  // 桌面版候選窗開在游標下方，靠右時往左收進畫面
  let left = 80, top = 600;
  if (c) {
    const r = c.getBoundingClientRect();
    left = Math.min(Math.max(20, r.left), 1080 - 20 - window.POPUP_DOCS.w * S);
    top = r.bottom + 12;
  }
  showDesktopPopup($('dpopDocs'), t, AT.docsPopup, ENTER.docs, left, top);
}

// ---------- 總結卡 ----------
{
  const rows = [K.summary.head, ...K.summary.rows];
  $('sum').innerHTML = rows.map((r, i) => `<div class="row${i ? '' : ' head'}">${r.map(c => `<div>${c}</div>`).join('')}</div>`).join('')
    + `<div id="sumTip">${K.summary.tip}</div>`;
}
function drawSummary(t) {
  const p = easeOutBack(seg(t, TIMES.sum, TIMES.sum + 0.35));
  $('sum').style.opacity = String(seg(t, TIMES.sum, TIMES.sum + 0.15));
  $('sum').style.transform = `scale(${t >= TIMES.sum ? lerp(0.85, 1, p) : 0.85})`;
}

window.render = (t) => {
  const u = t / TIMES.end * Math.PI * 2;
  $('blob1').style.transform = `translate(${40 * Math.sin(u)}px, ${-30 * Math.cos(u)}px)`;
  $('blob2').style.transform = `translate(${-30 * Math.cos(u)}px, ${30 * Math.sin(u)}px)`;
  drawLamps(t);
  drawCaptions(t);
  drawClock(t);
  drawWindows(t);
  const chrome = drawMail(t);
  drawChat(t);
  drawDocs(t);
  drawChromeUI(t, chrome);
  drawSummary(t);
  $('fade').style.opacity = String(seg(t, TIMES.out, TIMES.end - 0.1));
  return true;
};

// ---------- 畫面上實際看得到的狀態（全部從 DOM 讀） ----------
const css = (el) => getComputedStyle(el);
const seen = (el) => parseFloat(css(el).opacity) > 0.5 && css(el).visibility !== 'hidden';
const LAMP_RGB = (() => {
  const probe = document.createElement('i');
  probe.className = 'bulb on';
  document.body.appendChild(probe);
  const c = css(probe).backgroundColor;
  probe.remove();
  return c;
})();
const OVERFLOW = [];   // Task 4、5 登記會彈出的元素：{ name, el, shown: () => bool }
OVERFLOW.push(
  { name: 'Chrome 候選窗', el: CP_HOST, shown: () => CP_HOST.style.display === 'block' },
  { name: 'Chrome 小按鈕', el: CH_HOST, shown: () => CH_HOST.style.display === 'block' },
  { name: '桌面版候選窗（聊天）', el: $('dpopChat'), shown: () => seen($('dpopChat')) },
  { name: '桌面版候選窗（Google 文件）', el: $('dpopDocs'), shown: () => seen($('dpopDocs')) },
);
window.state = () => ({
  lampC: css($('lampC').firstChild).backgroundColor === LAMP_RGB,
  lampD: css($('lampD').firstChild).backgroundColor === LAMP_RGB,
  tag: seen($('tagC')) ? $('tagC').textContent : '',
  caption: seen($('caption')) ? $('caption').textContent : '',
  title: seen($('title')) ? $('title').textContent : '',
  clock: seen($('clock')) ? $('clock').textContent : '',
  summary: seen($('sum')) ? [...$('sum').querySelectorAll('.row')].map(r => [...r.children].map(c => c.textContent)) : [],
  tip: seen($('sum')) ? $('sumTip').textContent : '',
  mail: ownText($('mailText')),
  chat: ownText($('chatIn')),
  docs: ownText($('docsText')),
  chromePopup: CP_HOST.style.display === 'block' ? (CP_HOST.shadowRoot.querySelector('.item .z')?.textContent ?? '') : '',
  chromeHint: CH_HOST.style.display === 'block' ? (CH_HOST.shadowRoot.querySelector('.zh')?.textContent ?? '') : '',
  desktopPopup: seen($('dpopChat')) ? 'chat' : seen($('dpopDocs')) ? 'docs' : '',
  overflow: OVERFLOW.filter(o => o.shown()).filter(o => {
    const r = o.el.getBoundingClientRect();
    return r.left < 0 || r.top < 0 || r.right > 1080 || r.bottom > 1080;
  }).map(o => o.name),
});

render(0);
if (new URLSearchParams(location.search).has('play')) {
  const t0 = performance.now();
  const tick = () => { render(((performance.now() - t0) / 1000) % TIMES.end); requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}
