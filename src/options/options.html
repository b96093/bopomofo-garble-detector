<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>注音亂碼偵測 — 設定</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 460px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 { font-size: 20px; }
    .row { margin: 1.2rem 0; }
    .hint { color: #777; font-size: 13px; margin-top: 4px; }
    label { font-size: 15px; }
    fieldset { border: 1px solid #ddd; border-radius: 8px; padding: 12px 14px; }
    legend { font-size: 13px; color: #666; }
    #status { color: #178a4c; font-size: 13px; height: 16px; }
    /* 預設就顯示；JS 只在 SUPPORT_URL 為空時才隱藏（同 welcome.html） */
    #support { margin-top: 2rem; border-top: 1px solid #eee; padding-top: 1rem; }
    /* 做成看得出可以點的按鈕，與說明頁、桌面版一致 */
    #support a {
      display: inline-block; margin-top: .6rem; padding: .5rem .9rem;
      border: 1px solid #ddd; border-radius: 6px;
      color: #1a5fb4; font-size: 14px; text-decoration: none;
    }
    #support a:hover { background: #f6f9fd; border-color: #1a5fb4; }
  </style>
</head>
<body>
  <h1>注音亂碼偵測 — 設定</h1>

  <div class="row">
    <label><input type="checkbox" id="enabled"> 啟用偵測</label>
    <div class="hint">關閉後，打字時不會跳出候選窗。</div>
  </div>

  <fieldset>
    <legend>偵測靈敏度</legend>
    <div class="row">
      <label><input type="radio" name="mode" value="conservative"> 保守（建議）</label>
      <div class="hint">只有很有把握才跳，幾乎不打擾；偶爾可能漏接短亂碼。</div>
    </div>
    <div class="row">
      <label><input type="radio" name="mode" value="aggressive"> 積極</label>
      <div class="hint">寧可多跳、抓好抓滿；打英文時偶爾可能被跳出打擾。</div>
    </div>
  </fieldset>

  <p id="status"></p>
  <p class="hint">變更後，重新整理正在編輯的網頁即可生效。</p>

  <p class="hint">
    在 Google 文件、Chrome 新分頁與設定頁裡不會作用 —— 那是架構限制，不是設定問題。
    <a href="../welcome/welcome.html#limits" target="_blank">看說明與替代方案</a>
  </p>

  <p><a href="../welcome/welcome.html" target="_blank">重看使用說明</a></p>

  <div id="support">
    <div class="hint">這個工具永久免費，沒有廣告，也不收贊助。</div>
    <!-- href 的真正來源是 src/support.js，載入後由 options.js 覆寫；
         這裡寫死同一個網址，是為了 JS 沒跑起來時連結仍然可用。 -->
    <a id="support-link" target="_blank" rel="noopener"
       href="https://b96093.github.io/bopomofo-garble-detector/support">聯絡開發者</a>
  </div>

  <script type="module" src="options.js"></script>
</body>
</html>
